name: UAT to Prod Deployment

on:
  workflow_dispatch: # Manual trigger only

jobs:
  promote-to-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: uat

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Generate diff report
      run: |
        git fetch origin main
        # Create diff report
        git diff origin/main...HEAD -- . ':!*.md' ':!*.txt' > diff_report.patch
        echo "DIFF REPORT: UAT → Production" > diff_summary.md
        echo "=============================" >> diff_summary.md
        git diff --stat origin/main...HEAD >> diff_summary.md
        echo "" >> diff_summary.md
        echo "Detailed changes:" >> diff_summary.md
        git diff origin/main...HEAD -- . ':!*.md' ':!*.txt' >> diff_summary.md

        # Get commit history for release notes
        git log origin/main..HEAD --oneline --no-merges > release_notes.md

    - name: Create Pull Request to Production
      id: create-pr
      uses: actions/github-script@v6
      with:
        script: |
          const uatBranch = 'uat';
          const prodBranch = 'main';
          
          // Read release notes
          const releaseNotes = require('fs').readFileSync('release_notes.md', 'utf8');
          
          // Check if PR already exists
          const existingPRs = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head: `${context.repo.owner}:${uatBranch}`,
            base: prodBranch,
            state: 'open'
          });
          
          if (existingPRs.data.length > 0) {
            console.log('PR already exists: ', existingPRs.data[0].html_url);
            return { pr_number: existingPRs.data[0].number };
          }
          
          // Create new PR
          const pr = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🚀 Production Release - ${new Date().toISOString().split('T')[0]}`,
            head: uatBranch,
            base: prodBranch,
            body: `## Production Deployment from ${uatBranch}\n\n` +
                  `### 📋 Release Notes\n\`\`\`\n${releaseNotes}\n\`\`\`\n\n` +
                  `### Change Summary\n` +
                  'See attached diff report for detailed changes.\n\n' +
                  `**⚠️ Production Deployment - Requires Approval**`,
            draft: false
          });
          
          console.log('PR created: ', pr.data.html_url);
          return { pr_number: pr.data.number };

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: prod-deployment-${{ github.sha }}
        path: |
          diff_report.patch
          diff_summary.md
          release_notes.md
        retention-days: 90

    - name: Add required reviewers for production
      if: steps.create-pr.outputs.pr_number
      uses: actions/github-script@v6
      with:
        script: |
          // Add specific production approvers or rely on CODEOWNERS
          await github.rest.pulls.requestReviewers({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: ${{ steps.create-pr.outputs.pr_number }},
            team_reviewers: ['production-approvers'] // Replace with your team
          });