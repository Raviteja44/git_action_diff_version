name: Dev to UAT Deployment

on:
  workflow_dispatch: # Manual trigger only

jobs:
  promote-to-uat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: dev

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Generate diff report
      run: |
        git fetch origin uat
        # Create diff report
        git diff origin/uat...HEAD -- . ':!*.md' ':!*.txt' > diff_report.patch
        echo "DIFF REPORT: Dev → UAT" > diff_summary.md
        echo "======================" >> diff_summary.md
        git diff --stat origin/uat...HEAD >> diff_summary.md
        echo "" >> diff_summary.md
        echo "Detailed changes:" >> diff_summary.md
        git diff origin/uat...HEAD -- . ':!*.md' ':!*.txt' >> diff_summary.md

    - name: Create Pull Request to UAT
      id: create-pr
      uses: actions/github-script@v6
      with:
        script: |
          const devBranch = 'dev';
          const uatBranch = 'uat';
          
          // Get latest commit message from dev
          const commitMsg = `Promote changes from ${devBranch} to ${uatBranch}`;
          
          // Check if PR already exists
          const existingPRs = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head: `${context.repo.owner}:${devBranch}`,
            base: uatBranch,
            state: 'open'
          });
          
          if (existingPRs.data.length > 0) {
            console.log('PR already exists: ', existingPRs.data[0].html_url);
            return { pr_number: existingPRs.data[0].number };
          }
          
          // Create new PR
          const pr = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Deploy ${devBranch} to ${uatBranch} - ${new Date().toISOString().split('T')[0]}`,
            head: devBranch,
            base: uatBranch,
            body: `## Deployment from ${devBranch} to ${uatBranch}\n\n` +
                  `This PR requires approval from CODEOWNERS.\n\n` +
                  `### Change Summary:\n` +
                  'See attached diff report for detailed changes.\n\n' +
                  `**Auto-generated by GitHub Actions**`,
            draft: false
          });
          
          console.log('PR created: ', pr.data.html_url);
          return { pr_number: pr.data.number };

    - name: Upload diff report
      uses: actions/upload-artifact@v3
      with:
        name: uat-diff-report-${{ github.sha }}
        path: |
          diff_report.patch
          diff_summary.md
        retention-days: 30

    - name: Add CODEOWNERS review
      if: steps.create-pr.outputs.pr_number
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.pulls.requestReviewers({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: ${{ steps.create-pr.outputs.pr_number }},
            reviewers: [] // CODEOWNERS will be automatically added by GitHub
          });