name: Development to UAT Deployment

on:
  workflow_dispatch: # Manual trigger only

jobs:
  promote-to-uat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: uat

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Fetch all branches
      run: |
        git fetch origin
        echo "Available remote branches:"
        git branch -r

    - name: Generate diff report against dev
      run: |
        # Create diff report between dev and current uat branch
        git diff origin/dev...HEAD -- . ':!*.md' ':!*.txt' 2>/dev/null > diff_report.patch || echo "No differences found" > diff_report.patch
        echo "DIFF REPORT: Dev → UAT" > diff_summary.md
        echo "======================" >> diff_summary.md
        git diff --stat origin/dev...HEAD 2>/dev/null >> diff_summary.md || echo "No statistical differences" >> diff_summary.md

    - name: Create Pull Request to UAT
      id: create-pr
      uses: actions/github-script@v6
      with:
        script: |
          try {
            // Check if PR already exists from dev to uat
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'dev',
              base: 'uat',
              state: 'open'
            });
            
            if (existingPRs.data.length > 0) {
              console.log('PR already exists: ', existingPRs.data[0].html_url);
              core.setOutput('pr_url', existingPRs.data[0].html_url);
              return { pr_number: existingPRs.data[0].number, exists: true };
            }
            
            // Create new PR from dev to uat
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy dev to uat - ${new Date().toISOString().split('T')[0]}`,
              head: 'dev',
              base: 'uat',
              body: `## Deployment from dev to uat\n\n` +
                    `This PR requires approval.\n\n` +
                    `**Auto-generated by GitHub Actions**`,
              draft: false
            });
            
            console.log('PR created: ', pr.data.html_url);
            core.setOutput('pr_url', pr.data.html_url);
            core.setOutput('pr_number', pr.data.number);
            return { pr_number: pr.data.number, exists: false };
          } catch (error) {
            core.setFailed(`Error creating PR: ${error.message}`);
            return { pr_number: 0, exists: false, error: error.message };
          }

    - name: Upload diff report
      if: steps.create-pr.outputs.pr_number != 0
      uses: actions/upload-artifact@v4
      with:
        name: uat-diff-report-${{ github.sha }}
        path: |
          diff_report.patch
          diff_summary.md
        retention-days: 30