name: Promote Dev to UAT

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch (usually dev)'
        required: true
        type: string
        default: 'dev'
      target_branch:
        description: 'Target UAT branch'
        required: true
        type: string
        default: 'uat'

jobs:
  promote-dev-to-uat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout source branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.source_branch }}

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Generate UAT deployment report
      id: deployment-report
      run: |
        git fetch origin
        git fetch origin ${{ github.event.inputs.target_branch }}
        
        # Get deployment metrics
        COMMIT_COUNT=$(git log --oneline origin/${{ github.event.inputs.target_branch }}..HEAD | wc -l || echo "0")
        CHANGED_FILES=$(git diff --name-only origin/${{ github.event.inputs.target_branch }}...HEAD --diff-filter=ACMRT | tr '\n' ',' | sed 's/,$//' || echo "")
        
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        
        # Create UAT release notes
        echo "# UAT Deployment: ${{ github.event.inputs.source_branch }} → ${{ github.event.inputs.target_branch }}" > uat_release_notes.md
        echo "## Deployment Summary" >> uat_release_notes.md
        echo "- **Total Commits**: $COMMIT_COUNT" >> uat_release_notes.md
        echo "- **Environment**: User Acceptance Testing" >> uat_release_notes.md
        echo "- **Source**: ${{ github.event.inputs.source_branch }}" >> uat_release_notes.md
        echo "" >> uat_release_notes.md
        
        echo "## Commit History" >> uat_release_notes.md
        git log --pretty=format:"- **%h** %s (%an)" --reverse origin/${{ github.event.inputs.target_branch }}..HEAD >> uat_release_notes.md

    - name: Create UAT deployment PR
      id: create-pr
      uses: actions/github-script@v6
      with:
        script: |
          const sourceBranch = '${{ github.event.inputs.source_branch }}';
          const targetBranch = '${{ github.event.inputs.target_branch }}';
          const commitCount = '${{ steps.deployment-report.outputs.commit_count }}';
          const changedFilesCount = '${{ steps.deployment-report.outputs.changed_files }}'.split(',').filter(f => f).length;
          
          try {
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: sourceBranch,
              base: targetBranch,
              state: 'open'
            });
            
            if (existingPRs.data.length > 0) {
              console.log(' PR already exists: ', existingPRs.data[0].html_url);
              core.setOutput('pr_url', existingPRs.data[0].html_url);
              return { pr_number: existingPRs.data[0].number, exists: true };
            }
            
            const prBody = `## UAT Deployment: ${sourceBranch} → ${targetBranch}
            
### Deployment Overview
- **Commits being promoted**: ${commitCount}
- **Files changed**: ${changedFilesCount}
- **Target Environment**: User Acceptance Testing

### Pre-Deployment Checklist
- [ ] Development testing completed
- [ ] Code review approved


### Important Notes
- This deployment is for UAT environment only
- Requires approval from designated reviewers


---
*Auto-generated UAT Deployment PR*`;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `UAT Deployment - ${new Date().toISOString().split('T')[0]}`,
              head: sourceBranch,
              base: targetBranch,
              body: prBody,
              draft: false
            });
            
            console.log('UAT PR created: ', pr.data.html_url);
            core.setOutput('pr_url', pr.data.html_url);
            core.setOutput('pr_number', pr.data.number);
            return { pr_number: pr.data.number, exists: false };
          } catch (error) {
            core.setFailed(` Error creating UAT PR: ${error.message}`);
            return { pr_number: 0, exists: false, error: error.message };
          }