name: Cleanup on PR Merge
on:
  pull_request:
    types: [closed]
permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        uses: actions/github-script@v7
        with:
          script: |
            const headBranch = '${{ github.event.pull_request.head.ref }}';
            
            const tempBranchPatterns = [
              /^uat-/,           // uat-feature-branch-123456
              /^prod-/,          // prod-feature-branch-123456  
              /^uat-selective-/, // uat-selective-pr5-123456
              /^promote\//       // promote/feature-branch
            ];
            
            const isTemporary = tempBranchPatterns.some(pattern => 
              pattern.test(headBranch)
            );
            
            if (isTemporary) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${headBranch}`
                });
                console.log(`✅ Deleted: ${headBranch}`);
              } catch (error) {
                console.log(`ℹ️ ${headBranch} already deleted: ${error.message}`);
              }
            } else {
              console.log(`ℹ️ Skipping: ${headBranch}`);
            }