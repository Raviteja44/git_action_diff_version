name: Feature to Dev Deployment

on:
  push:
    branches: [ 'feature/**' ]
  workflow_dispatch: # Allows manual trigger

jobs:
  compare-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for diff
        ref: ${{ github.ref }}

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Get current branch name
      id: branch
      run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Generate diff report
      id: diff
      run: |
        git fetch origin dev
        # Get changed files
        CHANGED_FILES=$(git diff --name-only origin/dev...HEAD --diff-filter=ACMRT 2>/dev/null | tr '\n' ' ' || echo "")
        echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        
        # Create diff report
        git diff origin/dev...HEAD -- . ':!*.md' ':!*.txt' 2>/dev/null > diff_report.patch || echo "No differences found" > diff_report.patch
        echo "DIFF REPORT: ${{ steps.branch.outputs.branch }} → dev" > diff_summary.md
        echo "=================================" >> diff_summary.md
        git diff --stat origin/dev...HEAD 2>/dev/null >> diff_summary.md || echo "No statistical differences" >> diff_summary.md
        echo "" >> diff_summary.md
        echo "Detailed changes:" >> diff_summary.md
        git diff origin/dev...HEAD -- . ':!*.md' ':!*.txt' 2>/dev/null >> diff_summary.md || echo "No detailed differences found" >> diff_summary.md

    - name: Create Pull Request to Dev
      id: create-pr
      uses: actions/github-script@v6
      with:
        script: |
          const branchName = '${{ steps.branch.outputs.branch }}';
          const featureBranch = branchName;
          const devBranch = 'dev';
          
          try {
            // Check if PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${featureBranch}`,
              base: devBranch,
              state: 'open'
            });
            
            if (existingPRs.data.length > 0) {
              console.log('PR already exists: ', existingPRs.data[0].html_url);
              return { pr_number: existingPRs.data[0].number, exists: true };
            }
            
            // Create new PR
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy ${featureBranch} to ${devBranch}`,
              head: featureBranch,
              base: devBranch,
              body: `## Deployment from ${featureBranch} to ${devBranch}\n\n` +
                    `### Changed Files:\n` +
                    '${{ steps.diff.outputs.changed_files }}\n\n' +
                    `### Diff Summary:\n` +
                    'See attached diff report for detailed changes.\n\n' +
                    `**Auto-generated by GitHub Actions**`,
              draft: false
            });
            
            console.log('PR created: ', pr.data.html_url);
            return { pr_number: pr.data.number, exists: false };
          } catch (error) {
            console.error('Error creating PR:', error);
            // Don't fail the workflow if PR creation fails
            return { pr_number: 0, exists: false, error: error.message };
          }

    - name: Upload diff report
      if: steps.create-pr.outputs.pr_number != 0
      uses: actions/upload-artifact@v4
      with:
        name: diff-report-${{ github.sha }}
        path: |
          diff_report.patch
          diff_summary.md
        retention-days: 30

    - name: Comment on PR with diff summary
      if: steps.create-pr.outputs.pr_number != 0 && steps.create-pr.outputs.exists == 'false'
      uses: actions/github-script@v6
      with:
        script: |
          try {
            const fs = require('fs');
            let diffSummary = 'No diff summary available';
            if (fs.existsSync('diff_summary.md')) {
              diffSummary = fs.readFileSync('diff_summary.md', 'utf8');
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-pr.outputs.pr_number }},
              body: `## 🔍 Changes Detected\n\n\`\`\`\n${diffSummary}\n\`\`\`\n\nDownload full diff report from artifacts.`
            });
          } catch (error) {
            console.error('Error creating comment:', error);
          }